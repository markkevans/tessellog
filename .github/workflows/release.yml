name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish to npm
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:2.4.0
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Wait for Floci
        run: for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4566 && exit 0; sleep 1; done; exit 1
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Version packages from the pending changesets
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name README.md)" ]; then
            echo "No changesets to release. Add one with 'pnpm changeset' first." >&2
            exit 1
          fi
          pnpm changeset version
          pnpm install --lockfile-only
          version="$(node -p "require('./packages/core/package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset packages pnpm-lock.yaml
          git commit -m "chore: release v${version}"
      - run: bash scripts/pack-smoke/run.sh
      - name: Publish to npm with provenance
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push the release commit and tags
        run: git push --follow-tags
