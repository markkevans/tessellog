name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      floci:
        image: floci/floci:2.4.0
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Floci
        run: for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4566 && exit 0; sleep 1; done; exit 1
      - run: pnpm typecheck
      - run: pnpm test:coverage

  pack:
    name: Pack and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No high-severity advisories in published dependencies
        run: pnpm audit --prod --audit-level high
      - run: bash scripts/pack-smoke/run.sh

  docs:
    name: Docs site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tessellog/docs build

  interop:
    name: Interop with Tessera (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: interop/go/go.mod
          cache-dependency-path: interop/go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: bash interop/run.sh
